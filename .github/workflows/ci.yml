name: CI

on:
  push:
    branches: [Dev, main]
  pull_request:
    branches: [Dev, main]

jobs:
  version:
    name: Version (真版本号)
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.gen.outputs.app-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git rev-list --count HEAD 需要完整提交历史（默认浅克隆为 1）
          fetch-depth: 0
      - id: gen
        run: |
          V="$(scripts/version.sh)"
          echo "app-version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "### APP_VERSION: $V" >> "$GITHUB_STEP_SUMMARY"

  go-vet:
    name: Go vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 从 go.mod 读工具链要求（评审 2026.11.4 §6-2：钉 1.23 形同虚设，
          # 实际靠 GOTOOLCHAIN=auto 下载；go.mod 另有 toolchain go1.26.10）
          go-version-file: core/src/Verse.Engine/go.mod
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go vet ./...

  go-build:
    name: Go build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 从 go.mod 读工具链要求（评审 2026.11.4 §6-2：钉 1.23 形同虚设，
          # 实际靠 GOTOOLCHAIN=auto 下载；go.mod 另有 toolchain go1.26.10）
          go-version-file: core/src/Verse.Engine/go.mod
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go build ./...

  go-test-modernc:
    name: Go test (modernc, no CGO)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 从 go.mod 读工具链要求（评审 2026.11.4 §6-2：钉 1.23 形同虚设，
          # 实际靠 GOTOOLCHAIN=auto 下载；go.mod 另有 toolchain go1.26.10）
          go-version-file: core/src/Verse.Engine/go.mod
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go mod tidy
      # windows runner 默认 pwsh，Unix 的 VAR=1 前缀语法会直接报错
      - run: CGO_ENABLED=0 go test ./...
        shell: bash

  go-test-cgo:
    name: Go test (CGO, sqlite3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 从 go.mod 读工具链要求（评审 2026.11.4 §6-2：钉 1.23 形同虚设，
          # 实际靠 GOTOOLCHAIN=auto 下载；go.mod 另有 toolchain go1.26.10）
          go-version-file: core/src/Verse.Engine/go.mod
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: CGO_ENABLED=1 go test ./...

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          # 对齐本地开发环境（pnpm-workspace.yaml 使用 pnpm 10+ schema，
          # pnpm 9 解析会报 "packages field missing or empty"）
          version: 12
      - uses: actions/setup-node@v4
        with:
          # Vite 8 / vitest 4 要求 ^20.19 || >=22.12
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  gosec:
    name: Gosec security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 从 go.mod 读工具链要求（评审 2026.11.4 §6-2：钉 1.23 形同虚设，
          # 实际靠 GOTOOLCHAIN=auto 下载；go.mod 另有 toolchain go1.26.10）
          go-version-file: core/src/Verse.Engine/go.mod
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec -exclude-dir=pkg ./...

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # 从 go.mod 读工具链要求（评审 2026.11.4 §6-2：钉 1.23 形同虚设，
          # 实际靠 GOTOOLCHAIN=auto 下载；go.mod 另有 toolchain go1.26.10）
          go-version-file: core/src/Verse.Engine/go.mod
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...