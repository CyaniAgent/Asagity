name: CI

on:
  push:
    branches: [Dev, main]
  pull_request:
    branches: [Dev, main]

jobs:
  version:
    name: Version (真版本号)
    runs-on: ubuntu-latest
    outputs:
      app-version: ${{ steps.gen.outputs.app-version }}
    steps:
      - uses: actions/checkout@v4
        with:
          # git rev-list --count HEAD 需要完整提交历史（默认浅克隆为 1）
          fetch-depth: 0
      - id: gen
        run: |
          V="$(scripts/version.sh)"
          echo "app-version=$V" >> "$GITHUB_OUTPUT"
          echo "APP_VERSION=$V" >> "$GITHUB_ENV"
          echo "### APP_VERSION: $V" >> "$GITHUB_STEP_SUMMARY"

  go-vet:
    name: Go vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go vet ./...

  go-build:
    name: Go build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go build ./...

  go-test-modernc:
    name: Go test (modernc, no CGO)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go mod tidy
      - run: CGO_ENABLED=0 go test ./...

  go-test-cgo:
    name: Go test (CGO, sqlite3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: CGO_ENABLED=1 go test ./...

  frontend:
    name: Frontend build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  gosec:
    name: Gosec security scan
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec -exclude-dir=pkg ./...

  govulncheck:
    name: Go vulnerability check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - run: govulncheck ./...