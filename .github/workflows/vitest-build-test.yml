name: Vitest Build Test

on:
  push:
    branches: [Dev, main]
  pull_request:
    branches: [Dev, main]

jobs:
  version:
    name: Version (真版本号)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # git rev-list --count HEAD 需要完整提交历史（默认浅克隆为 1）
          fetch-depth: 0
      # 只保留 step summary 展示；outputs.app-version / GITHUB_ENV 的
      # APP_VERSION 曾声明但全工作流无任何 needs/后续步骤消费（死代码）
      - run: |
          V="$(scripts/version.sh)"
          echo "### APP_VERSION: $V" >> "$GITHUB_STEP_SUMMARY"

  go-vet:
    name: Go vet
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # 从 go.mod 读工具链要求（评审 2026.11.4 §6-2：钉 1.23 形同虚设，
          # 实际靠 GOTOOLCHAIN=auto 下载；go.mod 另有 toolchain go1.26.10）
          go-version-file: core/src/Verse.Engine/go.mod
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go vet ./...

  go-test-modernc:
    name: Go test (modernc, no CGO)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # 从 go.mod 读工具链要求（评审 2026.11.4 §6-2：钉 1.23 形同虚设，
          # 实际靠 GOTOOLCHAIN=auto 下载；go.mod 另有 toolchain go1.26.10）
          go-version-file: core/src/Verse.Engine/go.mod
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go mod tidy
      # 漂移检查：tidy 结果必须与已提交的 go.mod/go.sum 一致，否则报错
      # （此前缺这步，tidy 只会默默改文件，CI 永远绿）
      - run: git diff --exit-code -- go.mod go.sum
      # windows runner 默认 pwsh，Unix 的 VAR=1 前缀语法会直接报错
      - run: CGO_ENABLED=0 go test ./...
        shell: bash

  go-test-cgo:
    name: Go test (CGO, sqlite3)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # 从 go.mod 读工具链要求（评审 2026.11.4 §6-2：钉 1.23 形同虚设，
          # 实际靠 GOTOOLCHAIN=auto 下载；go.mod 另有 toolchain go1.26.10）
          go-version-file: core/src/Verse.Engine/go.mod
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: CGO_ENABLED=1 go test ./...

  frontend:
    name: Vitest Build Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          # 对齐本地开发环境（pnpm-workspace.yaml 使用 pnpm 10+ schema，
          # pnpm 9 解析会报 "packages field missing or empty"）
          version: 12
      - uses: actions/setup-node@v7
        with:
          # Vite 8 / vitest 4 要求 ^20.19 || >=22.12
          node-version: '22'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test

  dotnet:
    name: .NET build & test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # 与 13 个 csproj 的 <TargetFramework>net10.0</TargetFramework> 对齐
          dotnet-version: '10.0.x'
      # Verse.slnx 收录全部 13 个项目（Api/Data/Shared/9 Modules/Tests）
      - run: dotnet build Verse.slnx --nologo
      # 复用上一步构建产物，不重复编译
      - run: dotnet test Verse.slnx --no-build --nologo

  security:
    name: Security scan (gosec + govulncheck)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: core/src/Verse.Engine
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          # 从 go.mod 读工具链要求（评审 2026.11.4 §6-2：钉 1.23 形同虚设，
          # 实际靠 GOTOOLCHAIN=auto 下载；go.mod 另有 toolchain go1.26.10）
          go-version-file: core/src/Verse.Engine/go.mod
          cache-dependency-path: core/src/Verse.Engine/go.sum
      - run: go install github.com/securego/gosec/v2/cmd/gosec@latest
      - run: gosec -exclude-dir=pkg ./...
      # 前面的 gosec 失败也继续跑 govulncheck，一次拿全两个信号
      # （否则 gosec 红了要修完重跑才知道 govulncheck 状态）
      # 用 !cancelled() 而非 always()：取消时不拖住收尾
      - run: go install golang.org/x/vuln/cmd/govulncheck@latest
        if: ${{ !cancelled() }}
      - run: govulncheck ./...
        if: ${{ !cancelled() }}
