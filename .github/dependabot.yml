# Dependabot — 全仓依赖版本自动跟踪（根治 2026-11 审查发现的手动漂移：
# 4 个 GitHub Actions 落后 1~3 个大版本、68 个 Go 模块 + 23 个 npm 包过时）。
#
# PR 节奏：每周一次、每生态独立开 PR；security fixes 不受 schedule 限制。
# PR 标题走 Conventional Commits（chore(deps): ...），可直接走常规 review 流程。

version: 2
updates:
  # ── GitHub Actions（checkout / setup-go / setup-node / pnpm-action-setup 等）
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "github-actions"
    # Actions 大版本升级（v4 -> v7）会改 runtime（node20 -> node24），
    # 单独成 PR 便于核对 release notes 的 breaking changes。
    groups:
      actions-minor:
        update-types:
          - "minor"
          - "patch"

  # ── Go 模块（Verse.Engine + Verse.Cli 两个 go.mod 各自成组）
  - package-ecosystem: "gomod"
    directory: "/core/src/Verse.Engine"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "03:30"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    # Go 生态 minor/patch 先打包成一个 PR，major（bleve/sqlite 等跨度大的）
    # 独立开 PR 单独验证。
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "gomod"
    directory: "/core/src/Verse.Cli"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "go"
    groups:
      go-minor-patch:
        update-types:
          - "minor"
          - "patch"

  # ── npm（web 前端；pnpm-lock.yaml 由 Dependabot 原生支持）
  - package-ecosystem: "npm"
    directory: "/web"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:30"
      timezone: "Asia/Shanghai"
    commit-message:
      prefix: "chore"
      include: "scope"
    labels:
      - "dependencies"
      - "frontend"
    # framer-motion 12->14、jest-dom 6->7 这类 major 可能有 API 破坏，
    # 独立 PR 逐个过测试；minor/patch 打包。
    groups:
      npm-minor-patch:
        update-types:
          - "minor"
          - "patch"
    # open-pull-requests-limit 默认 5；前端 + Go + Actions 同周并发时留余量。
    open-pull-requests-limit: 10
